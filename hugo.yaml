baseURL: "https://ioditor.github.io/"
title: "iOditor"
locale: "ru-RU"
defaultContentLanguage: ru
enableRobotsTXT: true
enableGitInfo: false
disableKinds: [taxonomy, term]

module:
  hugoVersion:
    extended: true
    min: "0.146.0"
  imports:
    - path: github.com/imfing/hextra

markup:
  goldmark:
    renderer:
      unsafe: true
  highlight:
    noClasses: false

menu:
  main:
    - name: Документация
      pageRef: /docs
      weight: 10
    - name: Загрузка
      pageRef: /download
      weight: 20
    - name: Изменения
      pageRef: /changelog
      weight: 30
    - name: FAQ
      pageRef: /faq
      weight: 40
    - name: Поиск
      weight: 50
      params:
        type: search

params:
  description: "iOditor — пространство для текста, документов и идей. Markdown, PDF и визуальные заметки в одном приложении."
  navbar:
    displayTitle: true
    displayLogo: false
  theme:
    default: system
    displayToggle: true
  footer:
    enable: true
    displayCopyright: true
    displayPoweredBy: true
  search:
    enable: true
    type: flexsearch
    flexsearch:
      js: vendor/flexsearch.bundle.min.js
      index: content
      tokenize: forward
  editURL:
    enable: false
  displayUpdatedDate: false
  page:
    width: normal
    contextMenu:
      enable: false
  highlight:
    copy:
      enable: true
      display: hover

caches:
  images:
    dir: :cacheDir/images

